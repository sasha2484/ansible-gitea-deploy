---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
      - python3-docker
      - python3-yaml
      - git
      - docker-compose-plugin
    state: present

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/debian/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is running
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Create Gitea data directory
  file:
    path: "{{ gitea_data_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - gitea
    - postgres
    - certbot/conf
    - certbot/www

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy nginx.conf
  template:
    src: nginx.conf.j2
    dest: "{{ gitea_compose_dir }}/nginx.conf"
    mode: '0644'

- name: Deploy init-letsencrypt.sh
  template:
    src: init-letsencrypt.sh.j2
    dest: "{{ gitea_compose_dir }}/init-letsencrypt.sh"
    mode: '0755'

- name: Start Gitea stack (without SSL initially)
  docker_compose:
    project_src: "{{ gitea_compose_dir }}"
    state: present
  register: compose_start

- name: Wait for Gitea to be ready
  uri:
    url: "http://localhost:3000/"
    status_code: 200
    timeout: 5
  register: result
  until: result.status == 200
  retries: 30
  delay: 5

- name: Initialize SSL certificates
  command: "{{ gitea_compose_dir }}/init-letsencrypt.sh"
  register: ssl_init
  changed_when: "'Certificate successfully installed' in ssl_init.stdout"
  ignore_errors: yes

- name: Restart stack with SSL
  docker_compose:
    project_src: "{{ gitea_compose_dir }}"
    state: present
    restarted: yes
  when: ssl_init.changed

- name: Create admin user (if not exists)
  docker_container:
    name: gitea
    command: /bin/bash -c "
      /app/gitea/gitea admin user create
      --username {{ gitea_admin_user }}
      --password {{ gitea_admin_password }}
      --email {{ gitea_admin_email }}
      --admin || true"
    state: present
    recreate: no

- name: Display connection info
  debug:
    msg:
      - "Gitea + Nginx + SSL successfully deployed!"
      - "Web: https://{{ gitea_domain }}"
      - "SSH: ssh://git@{{ gitea_domain }}:{{ gitea_ssh_port }}"
      - "Admin: {{ gitea_admin_user }}"
      - "Password: {{ gitea_admin_password }}"
      - "Data: {{ gitea_data_dir }}"
      - "Compose: {{ gitea_compose_dir }}"