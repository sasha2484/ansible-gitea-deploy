---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required system packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
      - python3-docker
      - python3-yaml
      - git
      - docker.io
      - docker-buildx
    state: present

- name: Install Docker Compose plugin
  shell: |
    apt install -y docker-compose-plugin 2>/dev/null || \
    curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose && \
    chmod +x /usr/local/bin/docker-compose || true
  ignore_errors: yes

- name: Start Docker service
  shell: |
    systemctl start docker 2>/dev/null || service docker start 2>/dev/null || true
  ignore_errors: yes

- name: Create Gitea data directory
  file:
    path: "{{ gitea_data_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - gitea
    - postgres
    - certbot/conf
    - certbot/www

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy nginx.conf
  template:
    src: nginx.conf.j2
    dest: "{{ gitea_compose_dir }}/nginx.conf"
    mode: '0644'

- name: Deploy init-letsencrypt.sh
  template:
    src: init-letsencrypt.sh.j2
    dest: "{{ gitea_compose_dir }}/init-letsencrypt.sh"
    mode: '0755'

- name: Start Gitea stack (without SSL initially)
  shell: |
    cd {{ gitea_compose_dir }}
    docker compose up -d
  register: compose_result
  ignore_errors: yes

- name: Wait for Gitea to be ready
  uri:
    url: "http://localhost:3000/"
    status_code: 200
    timeout: 5
  register: result
  until: result.status == 200
  retries: 30
  delay: 5
  ignore_errors: yes

- name: Initialize SSL certificates
  shell: |
    cd {{ gitea_compose_dir }}
    bash ./init-letsencrypt.sh
  register: ssl_init
  ignore_errors: yes

- name: Restart stack with SSL
  shell: |
    cd {{ gitea_compose_dir }}
    docker compose restart
  when: ssl_init.rc == 0
  ignore_errors: yes

- name: Create admin user
  shell: |
    docker exec -i gitea /app/gitea/gitea admin user create \
      --username {{ gitea_admin_user }} \
      --password {{ gitea_admin_password }} \
      --email {{ gitea_admin_email }} \
      --admin || true
  ignore_errors: yes

- name: Display connection info
  debug:
    msg:
      - "✅ Gitea + Nginx + SSL successfully deployed!"
      - "🌐 Web: https://{{ gitea_domain }}"
      - "🔑 SSH: ssh://git@{{ gitea_domain }}:{{ gitea_ssh_port }}"
      - "👤 Admin: {{ gitea_admin_user }}"
      - "🔒 Password: {{ gitea_admin_password }}"
      - "📁 Data: {{ gitea_data_dir }}"
      - "📁 Compose: {{ gitea_compose_dir }}"
